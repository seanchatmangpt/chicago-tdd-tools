name: ggen standards receipt

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/standards/**'
      - 'standards/chicago-tdd/**'
      - 'scripts/verify_ggen_standards.py'
      - 'scripts/.verify_ggen_standards/**'
      - 'scripts/sabotage_ggen_standards.py'
      - 'scripts/run_real_ggen_standards.sh'
      - '.github/workflows/ggen-standards.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/standards/**'
      - 'standards/chicago-tdd/**'
      - 'scripts/verify_ggen_standards.py'
      - 'scripts/.verify_ggen_standards/**'
      - 'scripts/sabotage_ggen_standards.py'
      - 'scripts/run_real_ggen_standards.sh'
      - '.github/workflows/ggen-standards.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manufacture-verify-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned nightly for real ggen
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-06-22

      - name: Install ggen build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum sccache

      - name: Execute real pinned ggen manufacture
        run: bash scripts/run_real_ggen_standards.sh

      - name: Verify exact-head checkpoint and receipt closure
        run: |
          python3 scripts/verify_ggen_standards.py             --require-blake3             --require-exact-head             --exact-head "$GITHUB_SHA"             --write-receipt

      - name: Execute sabotage falsifiers
        run: python3 scripts/sabotage_ggen_standards.py

      - name: Compile generated standalone contract crate
        run: cargo test --manifest-path standards/chicago-tdd/generated/Cargo.toml

      - name: Prove generation idempotence
        run: |
          before="$(find standards/chicago-tdd/generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          python3 scripts/verify_ggen_standards.py             --write             --require-blake3             --require-exact-head             --exact-head "$GITHUB_SHA"
          after="$(find standards/chicago-tdd/generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$before" = "$after"
          git diff --exit-code -- standards/chicago-tdd/generated

      - name: Verify OCEL checkpoint evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("standards/chicago-tdd/evidence/checkpoints.ocel.json")
          data = json.loads(path.read_text())
          assert data["ocelVersion"] == "2.0"
          assert len(data["objects"]) == 10
          assert len(data["events"]) == 10
          assert {obj["id"] for obj in data["objects"]} == {
              f"GALL-{n:03d}" for n in range(13, 23)
          }
          PY

      - name: Publish exact-head evidence
        uses: actions/upload-artifact@v7
        with:
          name: chicago-tdd-ggen-receipt-${{ github.sha }}
          path: |
            standards/chicago-tdd/evidence/receipt.json
            standards/chicago-tdd/evidence/checkpoints.ocel.json
          if-no-files-found: error
