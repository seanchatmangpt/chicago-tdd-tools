name: Just shell contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - Justfile
      - scripts/verify_just_shell_contract.py
      - .github/workflows/just-shell-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: just-shell-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify startup and nounset boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Refuse subject drift
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "EXACT_HEAD=$actual"

      - name: Install real just
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: just

      - name: Verify Just shell contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify_just_shell_contract.py
          python3 scripts/verify_just_shell_contract.py
