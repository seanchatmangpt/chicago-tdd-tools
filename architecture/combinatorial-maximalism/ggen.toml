[project]
name = "chicago-tdd-combinatorial-maximalism"
version = "26.7.30"
description = "Canonical ggen combinatorial-maximalism architecture pack"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
standard_only = false

[generation]
output_dir = "generated"

[[generation.rules]]
name = "facets-rust"
query = { inline = """
PREFIX c: <https://chatmangpt.com/ontology/combinatorial-maximalism#>
PREFIX d: <http://purl.org/dc/terms/>
SELECT ?order ?id ?title ?phase ?description
WHERE {
  ?item a c:F ;
    c:o ?order ;
    c:i ?id ;
    d:title ?title ;
    c:h ?phase ;
    d:description ?description .
}
ORDER BY ?order
""" }
template = { file = "templates/facets.rs.tera" }
output_file = "src/facets.rs"
mode = "Overwrite"

[[generation.rules]]
name = "realizations-rust"
query = { inline = """
PREFIX c: <https://chatmangpt.com/ontology/combinatorial-maximalism#>
PREFIX d: <http://purl.org/dc/terms/>
SELECT ?order ?id ?facet ?module ?visibility ?authority ?effect ?protocol ?dependency ?standing ?receipt
WHERE {
  ?item a c:R ;
    c:o ?order ;
    c:i ?id ;
    c:f ?facet ;
    c:m ?module ;
    c:v ?visibility ;
    c:a ?authority ;
    c:e ?effect ;
    c:p ?protocol ;
    c:d ?dependency ;
    c:s ?standing ;
    c:q ?receipt .
}
ORDER BY ?order
""" }
template = { file = "templates/realizations.rs.tera" }
output_file = "src/realizations.rs"
mode = "Overwrite"

