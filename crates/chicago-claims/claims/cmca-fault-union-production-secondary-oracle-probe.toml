[[mutants]]
id = "xor-secondary-idempotence-probe"
description = "SECONDARY-ORACLE PROBE (not one of the 8 required mutants): same patch as `xor`, tested against the idempotence oracle instead of the disjoint-bit intended oracle"
intended_oracle_test = "oracle_union_is_idempotent_on_repeated_fault_bit"
repo_root = "/Users/sac/bcinr"
target_file = "crates/bcinr-cmca/src/fixed.rs"
search_pattern = "Self(self.0 | other.0)"
replace_pattern = "Self(self.0 ^ other.0)"
crate_dir = "crates/bcinr-cmca"
test_name = "oracle_union_is_idempotent_on_repeated_fault_bit"
test_binary = "fault_union_production_oracle"
timeout_secs = 600

[[mutants]]
