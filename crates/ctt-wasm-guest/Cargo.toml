[package]
name = "ctt-wasm-guest"
version = "26.10.12"
edition = "2021"
publish = false
description = "WASM guest cdylib: re-exports the chicago-tdd-tools conformance guest ABI for temprun-hosted execution"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chicago-tdd-tools = { path = "../..", default-features = false, features = [
  "wasm-guest",
  "conformance",
  "ledger",
  "logging",
] }

# Zero-import law: no wasm32 target dependencies. The parent crate's `uuid`
# usage (src/swarm/coordinator.rs, src/observability/ocel/collector.rs) is
# gated behind the optional `uuid-v4` feature (root Cargo.toml: `uuid` is
# `optional = true`), which this guest does NOT enable — so `uuid` (and its
# getrandom/wasm-bindgen JS backend) never compiles into the wasm artifact.
# Nothing in crates/ctt-wasm-guest/src or tests uses uuid directly. Do not
# re-add a `js`-feature uuid here; it would pull wasm-bindgen imports into
# the guest and break the empty-import-section census.

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

# Workspace member: root Cargo.toml members already includes "crates/ctt-wasm-guest"
# (coordinator). No nested [workspace] table — multi-root breaks cargo -p.
#
# Build (Gate 0 artifact):
#   cargo build --target wasm32-unknown-unknown --release -p ctt-wasm-guest
# Artifact:
#   target/wasm32-unknown-unknown/release/ctt_wasm_guest.wasm
#
# NOTE: profile.release in a non-root workspace member is ignored by cargo
# (profiles are root-only). Kept here to mirror pn_kernel's manifest intent.
# panic = "abort" is NOT carried to the workspace root [profile.release]
# deliberately: the NATO SEU courts (src/nato/seu.rs) depend on
# catch_unwind to score SDC, and abort would disable unwinding
# workspace-wide. In-workspace guest builds therefore keep unwind (a guest
# panic still traps at the wasm boundary); abort applies only to a
# standalone build of this crate.
