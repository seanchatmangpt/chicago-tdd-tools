[package]
name = "chicago-tdd-tools-playground"
version = "26.6.11"
edition = "2021"
authors = ["KNHK Team"]
license = "MIT"
description = "Comprehensive playground demonstrating all features of chicago-tdd-tools"
readme = "README.md"
keywords = ["testing", "tdd", "chicago-tdd", "playground"]
categories = ["development-tools::testing"]
publish = false

# Standalone package: not a member of the parent workspace.
[workspace]

[features]
# Chatman Engine validation suite (praxis-graphlaw). Off by default so the
# default playground build/test is unaffected.
chatman = [
    "dep:praxis-graphlaw",
    # Extra framework capabilities exercised by the chatman suite only, so the
    # default playground build stays byte-identical in behavior.
    "chicago-tdd-tools/receipt-validation",
    "chicago-tdd-tools/ocel-generation",
]

[dependencies]
# Chatman Engine under test (feature-gated; only built with --features chatman)
praxis-graphlaw = { path = "/Users/sac/praxis/crates/praxis-graphlaw", optional = true }

# Chicago TDD Tools with ALL features enabled
chicago-tdd-tools = { path = "..", version = "26.6.11", features = [
    # Feature groups (convenience bundles)
    "testing-full",       # All testing features: property, snapshot, mutation, concurrency, parameterized, cli, fake-data
    "observability-full", # Complete observability: otel, weaver
    "integration-full",   # Full integration: testcontainers, weaver

    # Individual features
    "async",            # Async fixture providers (Rust 1.75+)
    "mutation-testing", # Mutation testing (no external deps)
    "benchmarking",     # Criterion benchmarking support
    "workflow-engine",  # Workflow-specific features
    "logging",          # Log crate integration (enabled by default)
] }

# Tokio for async runtime
tokio = { version = "^1.0", features = ["rt", "rt-multi-thread", "macros"] }

# Serialization
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_yaml = "^0.9"

# CLI
clap = { version = "^4.5", features = ["derive"] }
clap-noun-verb = "3.7.1"
clap-noun-verb-macros = "3.7.1"
linkme = "0.3"

# Utilities
uuid = { version = "^1.0", features = ["v4"] }
chrono = "^0.4"

# Error handling
thiserror = "^2.0"

# Test utilities
tempfile = "^3.0"

# Library for sharing modules with binaries
[lib]
name = "playground"
path = "src/lib.rs"

[[bin]]
name = "playg"
path = "src/main.rs"

# ── Chatman Engine validation suite (feature-gated; never built by default) ──
[[test]]
name = "chatman_01_macros_aaa"
required-features = ["chatman"]

[[test]]
name = "chatman_02_assertions"
required-features = ["chatman"]

[[test]]
name = "chatman_03_builders_fixtures"
required-features = ["chatman"]

[[test]]
name = "chatman_04_property"
required-features = ["chatman"]

[[test]]
name = "chatman_05_parameterized"
required-features = ["chatman"]

[[test]]
name = "chatman_06_snapshot"
required-features = ["chatman"]

[[test]]
name = "chatman_07_receipts_chain"
required-features = ["chatman"]

[[test]]
name = "chatman_08_typestate_state_machine"
required-features = ["chatman"]

[[test]]
name = "chatman_09_mutation_score"
required-features = ["chatman"]

[[test]]
name = "chatman_10_performance"
required-features = ["chatman"]

[dev-dependencies]
# Test utilities
tokio-test = "^0.4"
# param_test! expands to #[rstest::rstest] in the consumer crate, so rstest
# must be a direct dev-dependency (version matched to chicago-tdd-tools').
rstest = "^0.19"
ntest = "^0.9"
assert_cmd = "^2.0"
predicates = "^3.0"
trycmd = { version = "^0.15", features = ["color-auto"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "allow"
unexpected_cfgs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Allow critical lints in playground for experimentation
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"
