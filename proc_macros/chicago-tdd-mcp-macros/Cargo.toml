[package]
name = "chicago-tdd-mcp-macros"
version = "26.7.1"
edition = "2021"
description = "Proc-macro attributes for chicago-tdd-mcp MCP testing"
license = "MIT"
repository = "https://github.com/seanchatmangpt/chicago-tdd-tools"
readme = "README.md"
keywords = ["testing", "tdd", "mcp", "proc-macro"]
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
which = "8"
