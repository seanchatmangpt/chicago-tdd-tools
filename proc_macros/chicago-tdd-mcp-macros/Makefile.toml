# Makefile.toml for chicago-tdd-mcp-macros
# Minimal stubs so cargo make workspace iteration does not fail.

[tasks.lint]
description = "Run clippy on chicago-tdd-mcp-macros"
command = "cargo"
args = ["clippy", "--manifest-path", "Cargo.toml", "--", "-D", "warnings"]

[tasks.fmt]
description = "Format chicago-tdd-mcp-macros"
command = "cargo"
args = ["fmt", "--manifest-path", "Cargo.toml"]

[tasks.test-unit]
description = "Run chicago-tdd-mcp-macros tests"
command = "cargo"
args = ["test", "--manifest-path", "Cargo.toml", "--lib"]

[tasks.docs-check]
description = "No-op: chicago-tdd-mcp-macros has no mdbook documentation"
script = ["echo '✅ docs-check: skipped for chicago-tdd-mcp-macros'"]

[tasks.spec]
description = "No-op for chicago-tdd-mcp-macros"
script = ["echo '✅ spec: skipped for chicago-tdd-mcp-macros'"]

[tasks.spec-check]
description = "No-op for chicago-tdd-mcp-macros"
script = ["echo '✅ spec-check: skipped for chicago-tdd-mcp-macros'"]
